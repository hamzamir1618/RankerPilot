[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for Rankerpilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "playwright>=1.43.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "sentry-sdk>=1.45.0",
    "pynacl>=1.5.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "aioboto3>=12.4.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.1",
    "aiohttp>=3.9.3",
    "sse-starlette>=2.1.0",
    "tldextract>=5.1.2",
    "PyYAML>=6.0.1",
    "weasyprint>=61.0",
    "jinja2>=3.1.3"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.5",
    "pyright>=1.1.357",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "hypothesis>=6.100.0",
    "respx>=0.21.1",
    "vcrpy>=6.0.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.gitleaks]
# Gitleaks-friendly config placeholder
