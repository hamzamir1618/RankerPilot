name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install Node dependencies
        run: pnpm install
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      - name: Install Python dev dependencies
        run: cd services/api && uv sync
      - name: Run Ruff (Lint)
        run: cd services/api && uv run ruff check .
      - name: Run ESLint
        run: pnpm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install Node dependencies
        run: pnpm install
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      - name: Install Python dev dependencies
        run: cd services/api && uv sync
      - name: Run Pyright
        run: cd services/api && uv run pyright .
      - name: Run TSC
        run: cd apps/web && pnpm exec tsc --noEmit || echo "No tsconfig yet"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      - name: Install Python dependencies
        run: cd services/api && uv sync
      - name: Run Pytest
        run: cd services/api && uv run pytest
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install Node dependencies
        run: pnpm install
      - name: Run Vitest/Jest Placeholder
        run: pnpm run test

  secretscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
