name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install Node dependencies
        run: pnpm install
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      - name: Setup env file
        run: cp .env.example .env
      - name: Install Python dev dependencies
        run: cd services/api && uv sync --all-extras
      - name: Run Ruff (Lint)
        run: cd services/api && uv run ruff check .
      - name: Run ESLint
        run: pnpm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install Node dependencies
        run: pnpm install
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      - name: Setup env file
        run: cp .env.example .env
      - name: Install Python dev dependencies
        run: cd services/api && uv sync --all-extras
      - name: Run Pyright
        run: cd services/api && uv run pyright .
      - name: Run TSC
        run: cd apps/web && pnpm exec tsc --noEmit || echo "No tsconfig yet"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rankerpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      - name: Setup env file
        run: cp .env.example .env
      - name: Install Python dependencies
        run: cd services/api && uv sync --all-extras
      - name: Install Playwright Browsers
        run: cd services/api && uv run playwright install chromium
      - name: Run Pytest
        run: cd services/api && uv run pytest
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install Node dependencies
        run: pnpm install
      - name: Run Vitest/Jest Placeholder
        run: pnpm run test

  secretscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
